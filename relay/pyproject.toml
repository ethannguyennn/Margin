[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "margin-relay"
version = "0.1.0"
description = "Margin relay: voice question -> grounded, citation-verified SOP answer for the Even G2 lens"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "sentry-sdk[fastapi]>=2.35",
    # Real-mode dependencies (Parts 4 and 5). Installed everywhere, imported lazily,
    # so MOCK_MODE=1 never touches them.
    "google-genai>=1.0",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "pyyaml>=6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/margin_relay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
