[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "margin-relay"
version = "0.1.0"
description = "Margin relay: voice question -> grounded, citation-verified SOP answer for the Even G2 lens"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "sentry-sdk[fastapi]>=2.35",
    # Real-mode dependencies (Parts 4 and 5). Installed everywhere, imported lazily,
    # so MOCK_MODE=1 never touches them.
    "google-genai>=1.0",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    # Corpus front matter for db/seed.py and POST /v1/ingest at runtime.
    "pyyaml>=6",
    # v2: multipart uploads for POST /v1/materials.
    "python-multipart>=0.0.9",
    # v2 conversion + diagrams (Part 4's list, README-PART-4 section 2). pypdfium2 is
    # Apache-2.0; PyMuPDF (AGPL) is deliberately not used.
    "Pillow>=10",
    "pypdf>=4",
    "pypdfium2>=4",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/margin_relay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
