# Relay + Caddy on the Vultr VM.  From the repo root:  make deploy
# (= docker compose -f deploy/docker-compose.yml --env-file .env up -d --build)
name: specs

services:
  relay:
    build:
      context: ..
      dockerfile: deploy/relay.Dockerfile
    env_file: ../.env
    environment:
      GIT_SHA: ${GIT_SHA:-unknown}
    restart: unless-stopped
    # Only Caddy talks to the relay; localhost binding is for debugging on the VM.
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      # Unresponsive for 3 tries -> SIGTERM PID 1 -> restart policy restarts it.
      test: ["CMD", "python", "/usr/local/bin/specs-healthcheck", "--kill"]
      interval: 15s
      timeout: 12s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  caddy:
    # Caddy with the employer portal baked in at /srv/portal (deploy/caddy.Dockerfile).
    build:
      context: ..
      dockerfile: deploy/caddy.Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SPECS_DOMAIN: ${SPECS_DOMAIN:?set SPECS_DOMAIN in .env, e.g. getyourassto.work}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env for the Let's Encrypt account}
    volumes:
      # The Caddyfile is baked into the image; the mount lets a config edit apply with
      # `docker compose restart caddy`, without a rebuild.
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      relay:
        condition: service_healthy

volumes:
  caddy_data: {}
  caddy_config: {}
