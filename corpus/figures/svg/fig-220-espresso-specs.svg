<svg xmlns="http://www.w3.org/2000/svg" width="576" height="288" viewBox="0 0 576 288"><defs><marker id="ah" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#000"/></marker><pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="1.4" fill="#000"/></pattern><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M-1,9 L9,-1" stroke="#000" stroke-width="1.6"/></pattern><pattern id="cross" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0,0 L12,12 M12,0 L0,12" stroke="#000" stroke-width="1.2"/></pattern></defs><rect width="576" height="288" fill="#fff"/><text x="20.0" y="30.3" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" text-anchor="start" font-weight="bold" fill="#000">The espresso standard</text><rect x="15" y="62" width="160" height="100" rx="8" fill="none" stroke="#000" stroke-width="2.5"/><text x="95.0" y="99.0" font-family="DejaVu Sans, Verdana, sans-serif" font-size="15" text-anchor="middle" fill="#000">18.0 g</text><text x="95.0" y="117.2" font-family="DejaVu Sans, Verdana, sans-serif" font-size="15" text-anchor="middle" fill="#000">ground coffee</text><text x="95.0" y="135.6" font-family="DejaVu Sans, Verdana, sans-serif" font-size="15" text-anchor="middle" fill="#000">(+/- 0.5 g)</text><line x1="175" y1="112.0" x2="208" y2="112.0" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><rect x="208" y="62" width="160" height="100" rx="8" fill="none" stroke="#000" stroke-width="2.5"/><text x="288.0" y="108.1" font-family="DejaVu Sans, Verdana, sans-serif" font-size="15" text-anchor="middle" fill="#000">Machine</text><text x="288.0" y="126.4" font-family="DejaVu Sans, Verdana, sans-serif" font-size="15" text-anchor="middle" fill="#000">200°F, 9 bar</text><line x1="368" y1="112.0" x2="401" y2="112.0" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><rect x="401" y="62" width="160" height="100" rx="8" fill="none" stroke="#000" stroke-width="2.5"/><text x="481.0" y="108.1" font-family="DejaVu Sans, Verdana, sans-serif" font-size="15" text-anchor="middle" fill="#000">36 g espresso</text><text x="481.0" y="126.4" font-family="DejaVu Sans, Verdana, sans-serif" font-size="15" text-anchor="middle" fill="#000">in 25 to 30 s</text><text x="288.0" y="210.2" font-family="DejaVu Sans, Verdana, sans-serif" font-size="15" text-anchor="middle" fill="#000">Small and Medium = one double (2 shots)</text><text x="288.0" y="235.2" font-family="DejaVu Sans, Verdana, sans-serif" font-size="15" text-anchor="middle" fill="#000">Large = double + single (3 shots)</text><text x="288.0" y="262.9" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" text-anchor="middle" fill="#000">Single shot: 9.0 g in, 18 g out</text></svg>