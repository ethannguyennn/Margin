1" y="55" width="160" height="90" rx="8" fill="none" stroke="#000" stroke-width="2.5"/><text x="481.0" y="87.8" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" text-anchor="middle" fill="#000">3 Approved:</text><text x="481.0" y="104.9" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" text-anchor="middle" fill="#000">it is on the</text><text x="481.0" y="122.0" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" text-anchor="middle" fill="#000">schedule</text><rect x="40" y="185" width="496" height="70" rx="8" fill="none" stroke="#000" stroke-width="2.5" stroke-dasharray="7 5"/><text x="288.0" y="216.4" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" text-anchor="middle" fill="#000">Sick or emergency: call the manager at least</text><text x="288.0" y="233.4" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" text-anchor="middle" fill="#000">2 hours before your shift. A text alone is not enough.</text></svg>