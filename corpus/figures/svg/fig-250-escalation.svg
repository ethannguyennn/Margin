<svg xmlns="http://www.w3.org/2000/svg" width="576" height="288" viewBox="0 0 576 288"><defs><marker id="ah" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#000"/></marker><pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="1.4" fill="#000"/></pattern><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M-1,9 L9,-1" stroke="#000" stroke-width="1.6"/></pattern><pattern id="cross" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0,0 L12,12 M12,0 L0,12" stroke="#000" stroke-width="1.2"/></pattern></defs><rect width="576" height="288" fill="#fff"/><text x="20.0" y="30.3" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" text-anchor="start" font-weight="bold" fill="#000">Upset or unsafe guest</text><rect x="30" y="190" width="172" height="80" rx="0" fill="none" stroke="#000" stroke-width="2.5"/><text x="116.0" y="218.9" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#000">1 Stay calm</text><text x="116.0" y="244.6" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" text-anchor="middle" fill="#000">listen, no arguing</text><rect x="202" y="135" width="172" height="135" rx="0" fill="none" stroke="#000" stroke-width="2.5"/><text x="288.0" y="163.9" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#000">2 Shift lead</text><text x="288.0" y="189.6" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" text-anchor="middle" fill="#000">hand it over</text><rect x="374" y="80" width="172" height="190" rx="0" fill="none" stroke="#000" stroke-width="2.5"/><text x="460.0" y="108.9" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#000">3 Unsafe?</text><text x="460.0" y="134.6" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" text-anchor="middle" fill="#000">call 911</text><rect x="20" y="50" width="300" height="56" rx="8" fill="none" stroke="#000" stroke-width="2.5" stroke-dasharray="7 5"/><text x="170.0" y="74.4" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" text-anchor="middle" fill="#000">Never raise your voice.</text><text x="170.0" y="91.4" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" text-anchor="middle" fill="#000">You may step away at any time.</text></svg>