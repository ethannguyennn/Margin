<svg xmlns="http://www.w3.org/2000/svg" width="576" height="288" viewBox="0 0 576 288"><defs><marker id="ah" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#000"/></marker><pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="1.4" fill="#000"/></pattern><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M-1,9 L9,-1" stroke="#000" stroke-width="1.6"/></pattern><pattern id="cross" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0,0 L12,12 M12,0 L0,12" stroke="#000" stroke-width="1.2"/></pattern></defs><rect width="576" height="288" fill="#fff"/><text x="20.0" y="30.3" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" text-anchor="start" font-weight="bold" fill="#000">Steaming milk: stretch, then spin</text><polyline points="75.0,70.0 85.0,170.0 175.0,170.0 185.0,70.0" fill="none" stroke="#000" stroke-width="3.5" stroke-linejoin="round"/><line x1="69.0" y1="110.0" x2="191.0" y2="110.0" stroke="#000" stroke-width="2" stroke-dasharray="7 5"/><line x1="205" y1="45" x2="142" y2="118" stroke="#000" stroke-width="6"/><text x="130.0" y="210.2" font-family="DejaVu Sans, Verdana, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#000">1 STRETCH</text><text x="130.0" y="228.7" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" text-anchor="middle" fill="#000">tip just under the surface</text><text x="130.0" y="244.6" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" text-anchor="middle" fill="#000">2-4 s latte, 6-8 s cappuccino,</text><text x="130.0" y="260.4" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" text-anchor="middle" fill="#000">1-2 s flat white</text><polyline points="375.0,70.0 385.0,170.0 475.0,170.0 485.0,70.0" fill="none" stroke="#000" stroke-width="3.5" stroke-linejoin="round"/><line x1="369.0" y1="110.0" x2="491.0" y2="110.0" stroke="#000" stroke-width="2" stroke-dasharray="7 5"/><line x1="500" y1="45" x2="440" y2="148" stroke="#000" stroke-width="6"/><path d="M392,150 C392,172 470,172 470,150" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><text x="430.0" y="210.2" font-family="DejaVu Sans, Verdana, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#000">2 SPIN</text><text x="430.0" y="236.6" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" text-anchor="middle" fill="#000">tip deeper, whirlpool</text><text x="430.0" y="252.5" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" text-anchor="middle" fill="#000">until target temperature</text><line x1="215" y1="120" x2="335" y2="120" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><text x="288.0" y="282.2" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" text-anchor="middle" fill="#000">Cold pitcher, milk 38-41°F first. Then wipe, purge, swirl, pour in 30 s.</text></svg>