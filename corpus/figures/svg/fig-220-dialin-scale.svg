<svg xmlns="http://www.w3.org/2000/svg" width="576" height="288" viewBox="0 0 576 288"><defs><marker id="ah" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#000"/></marker><pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="1.4" fill="#000"/></pattern><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M-1,9 L9,-1" stroke="#000" stroke-width="1.6"/></pattern><pattern id="cross" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0,0 L12,12 M12,0 L0,12" stroke="#000" stroke-width="1.2"/></pattern></defs><rect width="576" height="288" fill="#fff"/><text x="20.0" y="30.3" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" text-anchor="start" font-weight="bold" fill="#000">Shot time: what to do</text><rect x="40" y="115" width="140" height="46" rx="0" fill="url(#hatch)" stroke="#000" stroke-width="2.5"/><rect x="180" y="115" width="60" height="46" rx="0" fill="url(#dots)" stroke="#000" stroke-width="2.5"/><rect x="240" y="115" width="100" height="46" rx="0" fill="#fff" stroke="#000" stroke-width="2.5"/><rect x="340" y="115" width="60" height="46" rx="0" fill="url(#dots)" stroke="#000" stroke-width="2.5"/><rect x="400" y="115" width="140" height="46" rx="0" fill="url(#hatch)" stroke="#000" stroke-width="2.5"/><text x="110.0" y="81.4" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#000">Too fast:</text><text x="110.0" y="98.4" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#000">grind FINER</text><text x="210.0" y="81.9" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" text-anchor="middle" fill="#000">taste</text><text x="210.0" y="96.5" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" text-anchor="middle" fill="#000">it</text><text x="290.0" y="81.4" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#000">GOOD</text><text x="290.0" y="98.4" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#000">25-30 s</text><text x="370.0" y="81.9" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" text-anchor="middle" fill="#000">taste</text><text x="370.0" y="96.5" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" text-anchor="middle" fill="#000">it</text><text x="470.0" y="81.4" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#000">Too slow:</text><text x="470.0" y="98.4" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#000">grind COARSER</text><line x1="180" y1="161" x2="180" y2="172" stroke="#000" stroke-width="2"/><text x="180.0" y="192.9" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" text-anchor="middle" fill="#000">22</text><line x1="240" y1="161" x2="240" y2="172" stroke="#000" stroke-width="2"/><text x="240.0" y="192.9" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" text-anchor="middle" fill="#000">25</text><line x1="340" y1="161" x2="340" y2="172" stroke="#000" stroke-width="2"/><text x="340.0" y="192.9" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" text-anchor="middle" fill="#000">30</text><line x1="400" y1="161" x2="400" y2="172" stroke="#000" stroke-width="2"/><text x="400.0" y="192.9" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" text-anchor="middle" fill="#000">33</text><text x="288.0" y="230.2" font-family="DejaVu Sans, Verdana, sans-serif" font-size="15" text-anchor="middle" fill="#000">One notch at a time.</text><text x="288.0" y="255.2" font-family="DejaVu Sans, Verdana, sans-serif" font-size="15" text-anchor="middle" fill="#000">Discard the first 2 shots after any change.</text></svg>