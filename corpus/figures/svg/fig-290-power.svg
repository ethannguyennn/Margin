105" rx="8" fill="none" stroke="#000" stroke-width="2.5"/><text x="358.0" y="95.3" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" text-anchor="middle" fill="#000">3 Cash only,</text><text x="358.0" y="112.4" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" text-anchor="middle" fill="#000">write orders</text><text x="358.0" y="129.5" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" text-anchor="middle" fill="#000">on paper</text><line x1="417" y1="107.5" x2="441" y2="107.5" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><rect x="441" y="55" width="118" height="105" rx="8" fill="none" stroke="#000" stroke-width="2.5"/><text x="500.0" y="95.3" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" text-anchor="middle" fill="#000">4 Over 30 min:</text><text x="500.0" y="112.4" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" text-anchor="middle" fill="#000">manager decides</text><text x="500.0" y="129.5" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" text-anchor="middle" fill="#000">to close</text><text x="288.0" y="210.6" font-family="DejaVu Sans, Verdana, sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#000">Keep fridge doors CLOSED.</text><text x="288.0" y="239.9" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" text-anchor="middle" fill="#000">Dairy above 41°F for over 4 hours: discard.</text></svg>