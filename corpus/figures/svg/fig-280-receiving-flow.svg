<svg xmlns="http://www.w3.org/2000/svg" width="576" height="288" viewBox="0 0 576 288"><defs><marker id="ah" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#000"/></marker><pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="1.4" fill="#000"/></pattern><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M-1,9 L9,-1" stroke="#000" stroke-width="1.6"/></pattern><pattern id="cross" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0,0 L12,12 M12,0 L0,12" stroke="#000" stroke-width="1.2"/></pattern></defs><rect width="576" height="288" fill="#fff"/><text x="20.0" y="30.3" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" text-anchor="start" font-weight="bold" fill="#000">Receiving a delivery</text><rect x="15" y="118" width="100" height="54" rx="8" fill="none" stroke="#000" stroke-width="2.5"/><text x="65.0" y="141.4" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" text-anchor="middle" fill="#000">Delivery</text><text x="65.0" y="158.4" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" text-anchor="middle" fill="#000">arrives</text><line x1="115" y1="145" x2="135" y2="145" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><rect x="135" y="118" width="120" height="54" rx="8" fill="none" stroke="#000" stroke-width="2.5"/><text x="195.0" y="133.7" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" text-anchor="middle" fill="#000">Count it</text><text x="195.0" y="149.6" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" text-anchor="middle" fill="#000">against the</text><text x="195.0" y="165.4" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" text-anchor="middle" fill="#000">invoice</text><line x1="255" y1="145" x2="275" y2="145" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><polygon points="345.0,99.0 415.0,145.0 345.0,191.0 275.0,145.0" fill="none" stroke="#000" stroke-width="2.5" stroke-linejoin="round"/><text x="345.0" y="133.7" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" text-anchor="middle" fill="#000">Dairy</text><text x="345.0" y="149.6" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" text-anchor="middle" fill="#000">41°F or</text><text x="345.0" y="165.4" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" text-anchor="middle" fill="#000">below?</text><line x1="415" y1="145" x2="450" y2="145" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><text x="432.0" y="137.2" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" text-anchor="middle" fill="#000">yes</text><rect x="450" y="112" width="110" height="66" rx="8" fill="none" stroke="#000" stroke-width="2.5"/><text x="505.0" y="141.4" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" text-anchor="middle" fill="#000">Put away</text><text x="505.0" y="158.4" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" text-anchor="middle" fill="#000">now, FIFO</text><line x1="345" y1="191" x2="345" y2="214" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><text x="360.0" y="207.2" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" text-anchor="start" fill="#000">no</text><rect x="240" y="214" width="210" height="62" rx="8" fill="none" stroke="#000" stroke-width="2.5"/><text x="345.0" y="233.7" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" text-anchor="middle" fill="#000">Refuse it. Note it on</text><text x="345.0" y="249.6" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" text-anchor="middle" fill="#000">the invoice. Tell</text><text x="345.0" y="265.4" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" text-anchor="middle" fill="#000">the manager.</text></svg>