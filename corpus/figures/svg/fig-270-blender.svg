<svg xmlns="http://www.w3.org/2000/svg" width="576" height="288" viewBox="0 0 576 288"><defs><marker id="ah" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#000"/></marker><pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="1.4" fill="#000"/></pattern><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M-1,9 L9,-1" stroke="#000" stroke-width="1.6"/></pattern><pattern id="cross" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0,0 L12,12 M12,0 L0,12" stroke="#000" stroke-width="1.2"/></pattern></defs><rect width="576" height="288" fill="#fff"/><text x="20.0" y="30.3" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" text-anchor="start" font-weight="bold" fill="#000">Blender wash</text><rect x="15" y="60" width="118" height="110" rx="8" fill="none" stroke="#000" stroke-width="2.5"/><text x="74.0" y="111.6" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" text-anchor="middle" fill="#000">1 Rinse</text><text x="74.0" y="127.5" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" text-anchor="middle" fill="#000">the jar</text><line x1="133" y1="115.0" x2="157" y2="115.0" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><rect x="157" y="60" width="118" height="110" rx="8" fill="none" stroke="#000" stroke-width="2.5"/><text x="216.0" y="103.7" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" text-anchor="middle" fill="#000">2 Warm water +</text><text x="216.0" y="119.5" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" text-anchor="middle" fill="#000">soap, blend</text><text x="216.0" y="135.4" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" text-anchor="middle" fill="#000">10 seconds</text><line x1="275" y1="115.0" x2="299" y2="115.0" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><rect x="299" y="60" width="118" height="110" rx="8" fill="none" stroke="#000" stroke-width="2.5"/><text x="358.0" y="111.6" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" text-anchor="middle" fill="#000">3 Rinse</text><text x="358.0" y="127.5" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" text-anchor="middle" fill="#000">clean</text><line x1="417" y1="115.0" x2="441" y2="115.0" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><rect x="441" y="60" width="118" height="110" rx="8" fill="none" stroke="#000" stroke-width="2.5"/><text x="500.0" y="111.6" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" text-anchor="middle" fill="#000">4 Sanitize 60 s,</text><text x="500.0" y="127.5" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" text-anchor="middle" fill="#000">air dry</text><text x="288.0" y="220.2" font-family="DejaVu Sans, Verdana, sans-serif" font-size="15" text-anchor="middle" fill="#000">After EVERY use. Allergy order? Wash again.</text></svg>