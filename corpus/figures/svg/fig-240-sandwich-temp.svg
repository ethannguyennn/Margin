<svg xmlns="http://www.w3.org/2000/svg" width="576" height="288" viewBox="0 0 576 288"><defs><marker id="ah" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#000"/></marker><pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="1.4" fill="#000"/></pattern><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M-1,9 L9,-1" stroke="#000" stroke-width="1.6"/></pattern><pattern id="cross" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0,0 L12,12 M12,0 L0,12" stroke="#000" stroke-width="1.2"/></pattern></defs><rect width="576" height="288" fill="#fff"/><text x="20.0" y="30.3" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" text-anchor="start" font-weight="bold" fill="#000">Breakfast sandwich: 165°F</text><rect x="80" y="180" width="140" height="34" rx="14" fill="none" stroke="#000" stroke-width="2.5"/><rect x="75" y="158" width="150" height="22" rx="0" fill="url(#hatch)" stroke="#000" stroke-width="2"/><rect x="80" y="120" width="140" height="38" rx="18" fill="none" stroke="#000" stroke-width="2.5"/><line x1="150" y1="94" x2="150" y2="190" stroke="#000" stroke-width="5"/><circle cx="150" cy="70" r="24" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="150.0" y="74.5" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#000">165°F</text><text x="255.0" y="84.9" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" text-anchor="start" fill="#000">Cook until the inside reads 165°F.</text><text x="255.0" y="124.9" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" text-anchor="start" fill="#000">Probe the center, not the edge.</text><text x="255.0" y="156.4" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" text-anchor="start" fill="#000">Wipe the probe with a sanitizer</text><text x="255.0" y="173.4" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" text-anchor="start" fill="#000">wipe between uses.</text><text x="255.0" y="214.9" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" text-anchor="start" fill="#000">Handle with tongs or clean gloves.</text></svg>