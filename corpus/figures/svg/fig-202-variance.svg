<svg xmlns="http://www.w3.org/2000/svg" width="576" height="288" viewBox="0 0 576 288"><defs><marker id="ah" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#000"/></marker><pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="1.4" fill="#000"/></pattern><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M-1,9 L9,-1" stroke="#000" stroke-width="1.6"/></pattern><pattern id="cross" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0,0 L12,12 M12,0 L0,12" stroke="#000" stroke-width="1.2"/></pattern></defs><rect width="576" height="288" fill="#fff"/><text x="20.0" y="30.3" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" text-anchor="start" font-weight="bold" fill="#000">Till variance (count vs POS)</text><rect x="40" y="110" width="150" height="40" rx="0" fill="#fff" stroke="#000" stroke-width="2.5"/><rect x="190" y="110" width="170" height="40" rx="0" fill="url(#dots)" stroke="#000" stroke-width="2.5"/><rect x="360" y="110" width="180" height="40" rx="0" fill="url(#hatch)" stroke="#000" stroke-width="2.5"/><text x="115.0" y="93.2" font-family="DejaVu Sans, Verdana, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#000">Up to $2.00</text><text x="275.0" y="93.2" font-family="DejaVu Sans, Verdana, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#000">$2.00 to $5.00</text><text x="450.0" y="93.2" font-family="DejaVu Sans, Verdana, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#000">Over $5.00</text><text x="115.0" y="191.4" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" text-anchor="middle" fill="#000">Note it on</text><text x="115.0" y="208.4" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" text-anchor="middle" fill="#000">the close form</text><text x="275.0" y="191.4" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" text-anchor="middle" fill="#000">Tell shift lead</text><text x="275.0" y="208.4" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" text-anchor="middle" fill="#000">now, then recount</text><text x="450.0" y="191.4" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" text-anchor="middle" fill="#000">Also needs a</text><text x="450.0" y="208.4" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" text-anchor="middle" fill="#000">manager signature</text><text x="288.0" y="259.6" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" text-anchor="middle" fill="#000">Variance = how far over or short you are vs the POS report</text></svg>