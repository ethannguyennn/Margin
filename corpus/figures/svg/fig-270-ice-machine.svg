<svg xmlns="http://www.w3.org/2000/svg" width="576" height="288" viewBox="0 0 576 288"><defs><marker id="ah" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#000"/></marker><pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="1.4" fill="#000"/></pattern><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M-1,9 L9,-1" stroke="#000" stroke-width="1.6"/></pattern><pattern id="cross" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0,0 L12,12 M12,0 L0,12" stroke="#000" stroke-width="1.2"/></pattern></defs><rect width="576" height="288" fill="#fff"/><text x="20.0" y="30.3" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" text-anchor="start" font-weight="bold" fill="#000">Ice machine: monthly clean</text><rect x="15.0" y="52.0" width="166.0" height="82" rx="8" fill="none" stroke="#000" stroke-width="2.5"/><text x="98.0" y="89.4" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" text-anchor="middle" fill="#000">1 Turn off,</text><text x="98.0" y="106.4" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" text-anchor="middle" fill="#000">dump all ice</text><line x1="181.0" y1="93.0" x2="205.0" y2="93.0" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><rect x="205.0" y="52.0" width="166.0" height="82" rx="8" fill="none" stroke="#000" stroke-width="2.5"/><text x="288.0" y="80.8" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" text-anchor="middle" fill="#000">2 Add ice machine</text><text x="288.0" y="97.9" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" text-anchor="middle" fill="#000">cleaner (only the</text><text x="288.0" y="115.0" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" text-anchor="middle" fill="#000">approved one)</text><line x1="371.0" y1="93.0" x2="395.0" y2="93.0" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><rect x="395.0" y="52.0" width="166.0" height="82" rx="8" fill="none" stroke="#000" stroke-width="2.5"/><text x="478.0" y="89.4" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" text-anchor="middle" fill="#000">3 Run clean</text><text x="478.0" y="106.4" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" text-anchor="middle" fill="#000">cycle 20 min</text><polyline points="478.0,134.0 478.0,157.0 98.0,157.0 98.0,180.0" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><rect x="15.0" y="180.0" width="166.0" height="82" rx="8" fill="none" stroke="#000" stroke-width="2.5"/><text x="98.0" y="217.4" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" text-anchor="middle" fill="#000">4 Rinse with</text><text x="98.0" y="234.4" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" text-anchor="middle" fill="#000">clear water</text><line x1="181.0" y1="221.0" x2="205.0" y2="221.0" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><rect x="205.0" y="180.0" width="166.0" height="82" rx="8" fill="none" stroke="#000" stroke-width="2.5"/><text x="288.0" y="217.4" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" text-anchor="middle" fill="#000">5 Sanitize</text><text x="288.0" y="234.4" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" text-anchor="middle" fill="#000">quat 200-400 ppm</text><line x1="371.0" y1="221.0" x2="395.0" y2="221.0" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><rect x="395.0" y="180.0" width="166.0" height="82" rx="8" fill="none" stroke="#000" stroke-width="2.5"/><text x="478.0" y="208.8" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" text-anchor="middle" fill="#000">6 Restart,</text><text x="478.0" y="225.9" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" text-anchor="middle" fill="#000">toss first batch</text><text x="478.0" y="243.0" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" text-anchor="middle" fill="#000">of ice</text></svg>