<svg xmlns="http://www.w3.org/2000/svg" width="576" height="288" viewBox="0 0 576 288"><defs><marker id="ah" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#000"/></marker><pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="1.4" fill="#000"/></pattern><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M-1,9 L9,-1" stroke="#000" stroke-width="1.6"/></pattern><pattern id="cross" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0,0 L12,12 M12,0 L0,12" stroke="#000" stroke-width="1.2"/></pattern></defs><rect width="576" height="288" fill="#fff"/><text x="20.0" y="30.3" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" text-anchor="start" font-weight="bold" fill="#000">Spills and broken glass</text><rect x="15" y="60" width="118" height="100" rx="8" fill="none" stroke="#000" stroke-width="2.5"/><text x="74.0" y="97.8" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" text-anchor="middle" fill="#000">1 Yellow</text><text x="74.0" y="114.9" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" text-anchor="middle" fill="#000">wet-floor sign</text><text x="74.0" y="132.0" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" text-anchor="middle" fill="#000">out NOW</text><line x1="133" y1="110.0" x2="157" y2="110.0" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><rect x="157" y="60" width="118" height="100" rx="8" fill="none" stroke="#000" stroke-width="2.5"/><text x="216.0" y="106.4" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" text-anchor="middle" fill="#000">2 Wipe up</text><text x="216.0" y="123.4" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" text-anchor="middle" fill="#000">the spill</text><line x1="275" y1="110.0" x2="299" y2="110.0" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><rect x="299" y="60" width="118" height="100" rx="8" fill="none" stroke="#000" stroke-width="2.5"/><text x="358.0" y="106.4" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" text-anchor="middle" fill="#000">3 Dry the</text><text x="358.0" y="123.4" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" text-anchor="middle" fill="#000">floor</text><line x1="417" y1="110.0" x2="441" y2="110.0" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><rect x="441" y="60" width="118" height="100" rx="8" fill="none" stroke="#000" stroke-width="2.5"/><text x="500.0" y="97.8" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" text-anchor="middle" fill="#000">4 Remove sign</text><text x="500.0" y="114.9" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" text-anchor="middle" fill="#000">only when the</text><text x="500.0" y="132.0" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" text-anchor="middle" fill="#000">floor is dry</text><rect x="40" y="190" width="496" height="62" rx="8" fill="none" stroke="#000" stroke-width="2.5" stroke-dasharray="7 5"/><text x="288.0" y="217.1" font-family="DejaVu Sans, Verdana, sans-serif" font-size="15" text-anchor="middle" fill="#000">Broken glass: sweep with a dustpan.</text><text x="288.0" y="235.4" font-family="DejaVu Sans, Verdana, sans-serif" font-size="15" text-anchor="middle" fill="#000">NEVER pick it up by hand.</text></svg>