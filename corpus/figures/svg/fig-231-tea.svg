<svg xmlns="http://www.w3.org/2000/svg" width="576" height="288" viewBox="0 0 576 288"><defs><marker id="ah" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#000"/></marker><pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="1.4" fill="#000"/></pattern><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M-1,9 L9,-1" stroke="#000" stroke-width="1.6"/></pattern><pattern id="cross" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0,0 L12,12 M12,0 L0,12" stroke="#000" stroke-width="1.2"/></pattern></defs><rect width="576" height="288" fill="#fff"/><text x="20.0" y="30.3" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" text-anchor="start" font-weight="bold" fill="#000">Hot tea: water and steep time</text><rect x="15" y="50" width="170" height="200" rx="10" fill="none" stroke="#000" stroke-width="2.5"/><text x="100.0" y="88.3" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#000">BLACK</text><text x="100.0" y="145.5" font-family="DejaVu Sans, Verdana, sans-serif" font-size="30" text-anchor="middle" font-weight="bold" fill="#000">205°F</text><circle cx="62" cy="192" r="17" fill="none" stroke="#000" stroke-width="2.5"/><line x1="62" y1="192" x2="62" y2="180.95" stroke="#000" stroke-width="2.5"/><line x1="62" y1="192" x2="69.65" y2="192" stroke="#000" stroke-width="2.5"/><text x="122.0" y="199.3" font-family="DejaVu Sans, Verdana, sans-serif" font-size="21" text-anchor="middle" fill="#000">4 min</text><text x="100.0" y="238.2" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" text-anchor="middle" fill="#000">then remove the bag</text><rect x="203" y="50" width="170" height="200" rx="10" fill="none" stroke="#000" stroke-width="2.5"/><text x="288.0" y="88.3" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#000">GREEN</text><text x="288.0" y="145.5" font-family="DejaVu Sans, Verdana, sans-serif" font-size="30" text-anchor="middle" font-weight="bold" fill="#000">175°F</text><circle cx="250" cy="192" r="17" fill="none" stroke="#000" stroke-width="2.5"/><line x1="250" y1="192" x2="250" y2="180.95" stroke="#000" stroke-width="2.5"/><line x1="250" y1="192" x2="257.65" y2="192" stroke="#000" stroke-width="2.5"/><text x="310.0" y="199.3" font-family="DejaVu Sans, Verdana, sans-serif" font-size="21" text-anchor="middle" fill="#000">2 min</text><text x="288.0" y="238.2" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" text-anchor="middle" fill="#000">then remove the bag</text><rect x="391" y="50" width="170" height="200" rx="10" fill="none" stroke="#000" stroke-width="2.5"/><text x="476.0" y="88.3" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#000">HERBAL</text><text x="476.0" y="145.5" font-family="DejaVu Sans, Verdana, sans-serif" font-size="30" text-anchor="middle" font-weight="bold" fill="#000">212°F</text><circle cx="438" cy="192" r="17" fill="none" stroke="#000" stroke-width="2.5"/><line x1="438" y1="192" x2="438" y2="180.95" stroke="#000" stroke-width="2.5"/><line x1="438" y1="192" x2="445.65" y2="192" stroke="#000" stroke-width="2.5"/><text x="498.0" y="199.3" font-family="DejaVu Sans, Verdana, sans-serif" font-size="21" text-anchor="middle" fill="#000">5 min</text><text x="476.0" y="238.2" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" text-anchor="middle" fill="#000">then remove the bag</text><text x="288.0" y="276.6" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" text-anchor="middle" fill="#000">One tea bag per cup. Steep, then remove the bag.</text></svg>