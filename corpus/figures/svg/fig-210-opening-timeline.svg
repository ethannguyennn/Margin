<svg xmlns="http://www.w3.org/2000/svg" width="576" height="288" viewBox="0 0 576 288"><defs><marker id="ah" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#000"/></marker><pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="1.4" fill="#000"/></pattern><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M-1,9 L9,-1" stroke="#000" stroke-width="1.6"/></pattern><pattern id="cross" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0,0 L12,12 M12,0 L0,12" stroke="#000" stroke-width="1.2"/></pattern></defs><rect width="576" height="288" fill="#fff"/><text x="20.0" y="30.3" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" text-anchor="start" font-weight="bold" fill="#000">Opening: 5:15 to 6:00 AM</text><rect x="40.0" y="125" width="333.3333333333333" height="30" rx="0" fill="url(#hatch)" stroke="#000" stroke-width="2.5"/><rect x="373.3333333333333" y="125" width="166.66666666666666" height="30" rx="0" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="15.0" y="54.7" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" text-anchor="start" fill="#000">5:15 arrive,</text><text x="15.0" y="70.5" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" text-anchor="start" fill="#000">clock in,</text><text x="15.0" y="86.4" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" text-anchor="start" fill="#000">espresso ON</text><text x="206.7" y="112.9" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#000">warm-up 30 min: NO shots</text><text x="456.7" y="96.4" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#000">shots OK;</text><text x="456.7" y="113.4" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#000">open at 6:00</text><line x1="40.0" y1="155" x2="40.0" y2="166" stroke="#000" stroke-width="2"/><text x="40.0" y="184.9" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" text-anchor="middle" fill="#000">5:15</text><line x1="373.3333333333333" y1="155" x2="373.3333333333333" y2="166" stroke="#000" stroke-width="2"/><text x="373.3" y="184.9" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" text-anchor="middle" fill="#000">5:45</text><line x1="540.0" y1="155" x2="540.0" y2="166" stroke="#000" stroke-width="2"/><text x="540.0" y="184.9" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" text-anchor="middle" fill="#000">6:00</text><rect x="40" y="202" width="500" height="72" rx="6" fill="none" stroke="#000" stroke-width="2.5" stroke-dasharray="7 5"/><text x="290.0" y="234.6" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" text-anchor="middle" fill="#000">Meanwhile: log fridge temps (41°F or below), set grinder,</text><text x="290.0" y="250.5" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" text-anchor="middle" fill="#000">brew drip, fill ice, sanitizer bucket 200-400 ppm, restock</text></svg>