<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Specs · Admin portal</title>
    <script>
      // Set the theme before first paint so the page never flashes the wrong one.
      try { const t = localStorage.getItem('specs.portal.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}
    </script>
  </head>
  <body>
    <div class="demo">Demo build: upload synthetic material only.</div>
    <header>
      <a href="#upload" class="brand">SPECS</a><span>Admin portal</span>
      <div class="header-actions">
        <span id="workspace" hidden></span>
        <button id="theme" type="button" aria-label="Switch theme" title="Switch theme"></button>
        <button id="logout" hidden>Log out</button>
      </div>
    </header>
    <nav aria-label="Portal" hidden></nav>
    <p id="notice" role="status" aria-live="polite"></p>
    <main id="app"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
